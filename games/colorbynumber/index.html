<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Color by Number | Frog</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="top-bar">
        <a class="back-link" href="../index.html" aria-label="Back to games">‹</a>
        <div>
          <p>Color by Number</p>
          <h1>Frog Pond</h1>
        </div>
        <button class="icon-button" id="resetButton" type="button" aria-label="Reset picture" title="Reset">
          ↺
        </button>
      </header>

      <section class="stage-shell" aria-label="Coloring page">
        <div class="status-line" id="statusLine">Pick a color, then tap matching numbered areas.</div>
        <div class="stage-viewport" id="stageViewport">
          <canvas id="colorCanvas" aria-label="Frog color by number page"></canvas>
        </div>
      </section>

      <nav class="palette" id="palette" aria-label="Color palette"></nav>
    </main>

    <script src="app.js"></script>
  </body>
</html>
