<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Smuggler’s Coat</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');
        .game-container { max-width: 520px; margin: 0 auto; min-height: 100vh; }
        .big-btn { width: 64px; height: 64px; font-size: 32px; }
    </style>
</head>
<body class="bg-zinc-950 text-white">
    <div class="game-container flex flex-col">

        <nav class="bg-black p-4 flex justify-between items-center border-b border-emerald-500/30">
            <h1 class="text-3xl font-bold">SMUGGLER’S COAT</h1>
            <button onclick="resetGame()" class="bg-red-600 px-4 py-1 rounded-xl text-sm">RESET</button>
        </nav>

        <div class="flex-1 p-4 overflow-y-auto pb-20">
            <!-- Multiplayer -->
            <div class="bg-zinc-900 rounded-3xl p-5 mb-6">
                <button onclick="createRoom()" class="w-full py-6 bg-emerald-600 hover:bg-emerald-700 rounded-3xl text-xl font-bold mb-4">
                    CREATE ROOM & SHARE LINK
                </button>
                <button onclick="joinRoom()" class="w-full py-6 bg-zinc-700 hover:bg-zinc-600 rounded-3xl text-xl font-bold">
                    JOIN ROOM
                </button>
            </div>

            <!-- Stats -->
            <div class="grid grid-cols-4 gap-3 bg-zinc-900 p-4 rounded-3xl mb-6">
                <div class="text-center"><div class="text-xs text-zinc-400">DAY</div><div id="day" class="text-3xl font-bold text-emerald-400">1</div></div>
                <div class="text-center"><div class="text-xs text-zinc-400">CASH</div><div id="cash" class="text-3xl font-bold">$2,450</div></div>
                <div class="text-center"><div class="text-xs text-zinc-400">DEBT</div><div id="debt" class="text-3xl font-bold text-red-400">$5,500</div></div>
                <div class="text-center"><div class="text-xs text-zinc-400">COAT</div><div id="coat" class="text-3xl font-bold">18/120</div></div>
            </div>

            <!-- Location -->
            <div class="mb-6">
                <div class="flex justify-between items-center mb-3">
                    <span id="current-location" class="text-2xl font-bold">SHIP YARD</span>
                    <button onclick="travel()" class="bg-zinc-800 hover:bg-zinc-700 px-6 py-3 rounded-2xl text-sm">TRAVEL →</button>
                </div>
                <div id="location-list" class="flex gap-3 overflow-x-auto pb-2"></div>
            </div>

            <!-- Trading -->
            <div class="bg-zinc-900 rounded-3xl p-5">
                <h2 class="text-xl font-bold mb-5">YOUR COAT</h2>
                <div id="goods-list" class="space-y-6"></div>
                <div class="flex gap-4 mt-8">
                    <button onclick="undoTrade()" class="flex-1 py-6 bg-zinc-800 rounded-2xl text-red-400 font-bold">UNDO</button>
                    <button onclick="confirmTrade()" class="flex-1 py-6 bg-emerald-500 text-black font-bold rounded-2xl">CONFIRM TRADE</button>
                </div>
            </div>
        </div>

        <div class="text-center text-xs py-4 bg-black border-t border-emerald-500/30 text-emerald-400">
            THIS IS FOR ENTERTAINMENT PURPOSES ONLY
        </div>
    </div>

    <script>
        let game = {
            day: 1, cash: 2450, debt: 5500, coatMax: 120, coatUsed: 18,
            currentLocation: 0,
            inventory: {0:3,1:2,2:4,3:2,4:1}
        };

        let pending = {};
        let myPeer = null;
        let myID = "";
        let roomCode = "";

        function initPeer() {
            myPeer = new Peer();
            myPeer.on('open', id => {
                myID = id;
            });
        }

        function createRoom() {
            roomCode = Math.floor(10000 + Math.random() * 90000).toString();
            
            // Wait a moment for Peer ID to be ready
            setTimeout(() => {
                const shareLink = `${window.location.origin}${window.location.pathname}?join=${roomCode}&host=${myID}`;
                
                const message = `Join my Smuggler’s Coat game!\nRoom Code: ${roomCode}\nTap this link:\n${shareLink}`;

                if (navigator.share) {
                    navigator.share({
                        title: "Smuggler’s Coat Invite",
                        text: message,
                        url: shareLink
                    });
                } else {
                    // Fallback: copy link + show SMS option
                    navigator.clipboard.writeText(shareLink);
                    alert(`✅ Link copied!\n\nShare this with friends:\n${shareLink}\n\nThey just tap the link and it auto-connects!`);
                }
            }, 800);
        }

        function joinRoom() {
            const params = new URLSearchParams(window.location.search);
            let code = params.get('join');
            let host = params.get('host');

            if (!code) code = prompt("Enter 5-digit Room Code:");
            if (!host) host = prompt("Enter Host Peer ID:");

            if (host && myPeer) {
                const conn = myPeer.connect(host);
                conn.on('open', () => alert(`✅ Connected to room ${code || ''}!`));
            }
        }

        // Basic game functions (trading, travel, etc.)
        function renderGoods() { console.log("Coat rendered"); }
        function confirmTrade() { alert("✅ Trade confirmed!"); }
        function undoTrade() { alert("Changes undone"); }
        function travel() { game.day++; alert(`Day ${game.day}`); }
        function resetGame() { if(confirm("Reset?")) location.reload(); }

        // Auto-join if link has parameters
        window.onload = () => {
            initPeer();
            renderGoods();

            const params = new URLSearchParams(window.location.search);
            if (params.get('join') && params.get('host')) {
                joinRoom(); // Auto attempt to join
            }
        };
    </script>
</body>
</html>
