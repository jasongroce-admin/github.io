<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Smuggler’s Coat • LIVE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');
        .game-container { max-width:480px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; }
        .loan-shark { background: linear-gradient(#4c1d16, #7f1d1d); }
    </style>
</head>
<body class="bg-zinc-950 text-white font-sans">
    <div id="app" class="game-container">
        <nav class="bg-black p-3 flex justify-between items-center border-b border-emerald-500/30 sticky top-0">
            <h1 class="font-bold text-2xl">SMUGGLER’S COAT</h1>
            <div class="flex gap-2">
                <button onclick="createRoom()" class="bg-emerald-600 px-4 py-1 rounded-xl text-sm">CREATE ROOM</button>
                <button onclick="joinRoom()" class="bg-zinc-700 px-4 py-1 rounded-xl text-sm">JOIN ROOM</button>
            </div>
        </nav>

        <div class="flex-1 p-4 overflow-y-auto pb-24">
            <!-- Stats -->
            <div class="grid grid-cols-4 gap-2 text-center bg-zinc-900 p-3 rounded-3xl mb-5">
                <div><div class="text-[10px] text-zinc-400">DAY</div><div id="day" class="text-3xl font-bold text-emerald-400">12</div></div>
                <div><div class="text-[10px] text-zinc-400">CASH</div><div id="cash" class="text-3xl font-bold">$18,420</div></div>
                <div><div class="text-[10px] text-zinc-400">DEBT</div><div id="debt" class="text-3xl font-bold text-red-400">$3,200</div></div>
                <div><div class="text-[10px] text-zinc-400">COAT</div><div id="coat" class="text-3xl font-bold">67/120</div></div>
            </div>

            <div class="mb-5">
                <div class="flex justify-between items-center mb-3">
                    <span id="current-location" class="text-xl font-bold">MANHATTAN</span>
                    <button onclick="travel()" class="bg-zinc-800 hover:bg-zinc-700 px-6 py-3 rounded-2xl text-sm">TRAVEL →</button>
                </div>
                <div id="location-list" class="flex gap-3 overflow-x-auto pb-3"></div>
            </div>

            <div id="loan-banner" class="hidden loan-shark rounded-3xl p-5 mb-6 text-center">
                <div class="text-xl font-bold mb-2">💰 LOAN SHARK OFFICE</div>
                <button onclick="payDebt()" class="w-full py-5 bg-red-600 hover:bg-red-700 rounded-2xl text-white font-bold text-lg">PAY BACK DEBT NOW</button>
            </div>

            <div class="bg-zinc-900 rounded-3xl p-5 mb-6">
                <h3 class="text-sm font-medium mb-4">NEARBY SMUGGLERS <span id="nearby-count" class="text-emerald-400">(0)</span></h3>
                <div id="nearby-list" class="space-y-3"></div>
            </div>

            <div class="bg-zinc-900 rounded-3xl p-5">
                <h2 class="text-lg font-semibold mb-4">YOUR COAT</h2>
                <div id="goods-list" class="space-y-6"></div>
            </div>
        </div>

        <div id="disclaimer" class="fixed bottom-0 left-0 right-0 text-center text-xs py-4 bg-black border-t border-emerald-500/30 text-emerald-400">
            THIS IS FOR ENTERTAINMENT PURPOSES ONLY
        </div>
    </div>

    <script>
        let game = { /* same as before - day, cash, debt, locations, goods, inventory */ 
            day: 12, maxDays: 30, cash: 18420, debt: 3200, coatMax: 120, coatUsed: 67,
            currentLocation: 1, inventory: {0:12,1:5,2:23},
            locations: [{name:"BRONX",emoji:"🏙️"},{name:"MANHATTAN",emoji:"🌆"},{name:"BROOKLYN",emoji:"🌉"},{name:"QUEENS",emoji:"🛫"},{name:"CONEY ISLAND",emoji:"🎡"},{name:"LOAN SHARK",emoji:"💰",isLoan:true}],
            goods: [{id:0,name:"Cuban Cigars",price:520},{id:1,name:"Fine Whiskey",price:1250},{id:2,name:"Perfume",price:780},{id:3,name:"Luxury Watches",price:4600}]
        };

        let myPeer = null;
        let myID = "";
        let roomCode = "";
        let connections = [];

        function initPeer() {
            myPeer = new Peer();
            myPeer.on('open', id => { myID = id; });
            myPeer.on('connection', conn => {
                connections.push(conn);
                alert("Someone joined your room!");
            });
        }

        function createRoom() {
            roomCode = Math.random().toString(36).substring(2,8).toUpperCase(); // 6 char code
            alert(`Room created!\n\nShare this code with friends:\n\n${roomCode}\n\nYour Peer ID (they need this too):\n${myID || "Waiting..."}`);
        }

        function joinRoom() {
            const code = prompt("Enter Room Code:");
            if (!code) return;
            const peerId = prompt("Enter Host's Peer ID (ask the room creator):");
            if (!peerId) return;
            const conn = myPeer.connect(peerId);
            conn.on('open', () => alert("Connected to room " + code + "!"));
        }

        // Rest of game functions (renderLocations, renderGoods, renderNearby, payDebt, travel, etc.) are the same as previous version.
        // For brevity they are omitted here but copy them from the last full file I gave you.

        window.onload = () => {
            // render calls...
            initPeer();
            // ... other renders
        };
    </script>
</body>
</html>
