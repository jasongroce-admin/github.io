<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Smuggler’s Coat • LIVE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');
        .game-container { max-width:480px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; }
        .loan-shark { background: linear-gradient(#4c1d16, #7f1d1d); }
    </style>
</head>
<body class="bg-zinc-950 text-white">
    <div id="app" class="game-container">
        <!-- Navbar -->
        <nav class="bg-black p-3 flex justify-between items-center border-b border-emerald-500/30">
            <h1 class="font-bold text-xl">SMUGGLER’S COAT <span class="text-emerald-400 text-sm">LIVE</span></h1>
            <div id="online-count" class="bg-emerald-900 px-3 py-1 rounded-full text-xs">12 online</div>
        </nav>

        <!-- Main Game -->
        <div class="flex-1 p-4 overflow-y-auto">
            <!-- Stats -->
            <div class="grid grid-cols-4 gap-2 text-center bg-zinc-900 p-3 rounded-2xl mb-4">
                <div><div class="text-xs text-zinc-400">DAY</div><div id="day" class="text-2xl font-bold">1</div></div>
                <div><div class="text-xs text-zinc-400">CASH</div><div id="cash" class="text-2xl font-bold">$2,450</div></div>
                <div><div class="text-xs text-zinc-400">DEBT</div><div id="debt" class="text-2xl font-bold text-red-400">$5,500</div></div>
                <div><div class="text-xs text-zinc-400">COAT</div><div id="coat" class="text-2xl font-bold">42/120</div></div>
            </div>

            <!-- Location -->
            <div class="mb-4">
                <div class="flex justify-between items-center mb-2">
                    <span class="font-medium text-lg" id="current-location">MANHATTAN</span>
                    <button onclick="travel()" class="bg-zinc-800 hover:bg-zinc-700 px-5 py-2 rounded-xl text-sm flex items-center gap-1">
                        TRAVEL →
                    </button>
                </div>
                <div id="location-list" class="flex gap-2 overflow-x-auto pb-2"></div>
            </div>

            <!-- Loan Shark Banner (appears when there) -->
            <div id="loan-banner" class="hidden loan-shark rounded-3xl p-4 mb-6 text-center">
                <div class="text-xl font-bold flex items-center justify-center gap-2">
                    💰 LOAN SHARK OFFICE
                </div>
                <button onclick="payDebt()" 
                        class="mt-4 w-full py-4 bg-red-600 hover:bg-red-700 rounded-2xl text-white font-semibold text-lg">
                    PAY BACK DEBT NOW
                </button>
            </div>

            <!-- Nearby Traders -->
            <div class="bg-zinc-900 rounded-3xl p-4 mb-6">
                <h3 class="text-sm font-medium mb-3">NEARBY SMUGGLERS</h3>
                <div id="nearby-list" class="space-y-3"></div>
            </div>

            <!-- Your Coat -->
            <div id="goods-list" class="space-y-4"></div>
        </div>

        <!-- Bottom disclaimer -->
        <div id="disclaimer" class="text-center text-xs py-3 bg-black border-t border-emerald-500/30 text-emerald-400">
            THIS IS FOR ENTERTAINMENT PURPOSES ONLY
        </div>
    </div>

    <script>
        let game = {
            day: 1, maxDays: 30,
            cash: 2450, debt: 5500,
            coatMax: 120, coatUsed: 42,
            currentLocation: 0,
            inventory: {0:12, 1:8, 2:45},
            locations: [
                {name: "BRONX", emoji: "🏙️"},
                {name: "MANHATTAN", emoji: "🌆"},
                {name: "BROOKLYN", emoji: "🌉"},
                {name: "QUEENS", emoji: "🛫"},
                {name: "CONEY ISLAND", emoji: "🎡"},
                {name: "LOAN SHARK", emoji: "💰", isLoan: true}
            ]
        };

        function renderLocations() {
            const container = document.getElementById('location-list');
            container.innerHTML = '';
            game.locations.forEach((loc, i) => {
                const active = i === game.currentLocation ? 'ring-2 ring-red-500' : '';
                const div = document.createElement('div');
                div.className = `flex-shrink-0 px-5 py-3 bg-zinc-800 rounded-2xl text-center cursor-pointer ${active} ${loc.isLoan ? 'border border-red-500' : ''}`;
                div.innerHTML = `
                    <div class="text-3xl mb-1">${loc.emoji}</div>
                    <div class="text-xs font-bold">${loc.name}</div>
                `;
                div.onclick = () => {
                    game.currentLocation = i;
                    document.getElementById('current-location').textContent = loc.name;
                    document.getElementById('loan-banner').classList.toggle('hidden', !loc.isLoan);
                    renderLocations();
                };
                container.appendChild(div);
            });
        }

        function renderHeader() {
            document.getElementById('day').textContent = game.day;
            document.getElementById('cash').textContent = '$' + game.cash.toLocaleString();
            document.getElementById('debt').textContent = '$' + game.debt.toLocaleString();
            document.getElementById('coat').textContent = game.coatUsed + '/' + game.coatMax;
        }

        function payDebt() {
            const amount = prompt(`How much to pay? (Debt: $${game.debt})`, game.debt);
            if (!amount) return;
            const pay = Math.min(parseInt(amount) || 0, game.cash);
            if (pay <= 0) return;
            
            game.cash -= pay;
            game.debt = Math.max(0, game.debt - pay);
            renderHeader();
            alert(`Paid $${pay}. New debt: $${game.debt}`);
        }

        function travel() {
            game.day++;
            if (game.day > game.maxDays) {
                alert("Game Over! Final cash after debt: $" + Math.max(0, game.cash - game.debt));
                return;
            }
            game.debt = Math.floor(game.debt * 1.015);
            renderHeader();
            alert("New day. Prices and players updated.");
        }

        // Boot
        window.onload = () => {
            renderLocations();
            renderHeader();
            // Rotating disclaimer
            const msgs = ["SAY NO TO DRUGS", "THIS IS FOR ENTERTAINMENT PURPOSES ONLY"];
            let i = 0;
            setInterval(() => {
                i = (i + 1) % msgs.length;
                document.getElementById('disclaimer').textContent = msgs[i];
            }, 4800);
        };
    </script>
</body>
</html>
