<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Patrol</title>
    <link rel="stylesheet" href="../../assets/css/site.css?v=20260416" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main id="gameShell" aria-label="Patrol game">
      <canvas id="gameCanvas" width="1280" height="720"></canvas>

      <section id="mapModePanel" aria-label="Choose map style">
        <h1>Patrol</h1>
        <p>Choose the map background for this shift.</p>
        <div>
          <button type="button" data-map-mode="imagery">USGS</button>
          <button type="button" data-map-mode="topo">USGS Topo</button>
          <button type="button" data-map-mode="game">Game</button>
        </div>
      </section>

      <section id="hud" aria-live="polite">
        <div class="hud-row">
          <div>
            <strong>Patrol</strong>
            <span id="statusLine">Patrol shift active</span>
          </div>
          <div id="scoreBox">
            <span>Calls</span>
            <strong id="callsCleared">0</strong>
          </div>
        </div>
        <div id="vehicleHealth">
          <span>Vehicle</span>
          <div><i id="healthFill"></i></div>
          <strong id="healthText">100%</strong>
        </div>
        <div id="dispatchPanel">
          <div class="dispatch-top">
            <span>RADIO</span>
            <span id="dispatchTimer">--</span>
          </div>
          <h2 id="dispatchTitle">No active call</h2>
          <p id="dispatchBody">Free roam until dispatch sends the next call.</p>
          <div class="dispatch-actions">
            <button id="acceptCallBtn" type="button">Accept</button>
            <button id="declineCallBtn" type="button">Decline</button>
          </div>
        </div>
      </section>

      <section id="controlsHint">
        <span>Move: WASD / Arrows</span>
        <span>Handbrake: Space</span>
        <span>Lights/Siren: L</span>
        <span>Interact: E</span>
        <span>Decline: Q</span>
        <span>Zoom: Z</span>
      </section>

      <section id="mobileControls" aria-label="Touch driving controls">
        <div id="mobileJoystick" aria-label="Virtual joystick" role="application">
          <div id="joystickBase">
            <div id="joystickStick"></div>
          </div>
        </div>
        <div id="mobileActionButtons" aria-label="Touch action controls">
          <button id="mobileLightsBtn" type="button" aria-label="Toggle lights and siren" aria-pressed="false">Lights</button>
          <button id="mobileEngageBtn" type="button" aria-label="Engage with a stopped vehicle">Engage</button>
        </div>
      </section>

      <section id="trainingPanel" class="hidden" aria-label="Training interaction">
        <div class="training-card">
          <div class="training-top">
            <span id="trainingTag">TRAFFIC STOP</span>
            <button id="closeTrainingBtn" type="button" aria-label="Close interaction">Close</button>
          </div>
          <h2 id="trainingTitle">Traffic Stop</h2>
          <p id="trainingNarrative"></p>
          <div id="trainingFacts"></div>
          <div id="trainingOptions"></div>
        </div>
      </section>
    </main>

    <script src="map.js"></script>
    <script src="game.js"></script>
  </body>
</html>
