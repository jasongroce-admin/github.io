<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Monsters Unlimited Builder</title>
    <link rel="stylesheet" href="../../assets/css/site.css?v=20260509" />
    <link rel="stylesheet" href="builder.css?v=20260527-3" />
  </head>
  <body>
    <main class="builder-shell">
      <aside class="builder-panel">
        <a class="menu-link" href="index.html">Play</a>
        <h1>MU Builder</h1>
        <label>Level Title <input id="levelTitle" type="text" /></label>
        <label>City <input id="cityName" type="text" /></label>
        <label>Monster <select id="monsterId"></select></label>
        <div class="grid-two">
          <label>Health <input id="health" type="number" min="20" max="300" /></label>
          <label>Punch <input id="punchDamage" type="number" min="1" max="8" /></label>
          <label>Speed <input id="speed" type="number" min="80" max="500" /></label>
          <label>Climb <input id="climbSpeed" type="number" min="80" max="500" /></label>
        </div>
        <div class="tool-row" role="group" aria-label="Builder tools">
          <button data-tool="select" class="active" type="button">Select</button>
          <button data-tool="building" type="button">Building</button>
          <button data-tool="human" type="button">Human</button>
          <button data-tool="vehicle" type="button">Vehicle</button>
          <button data-tool="rig" type="button">Rig</button>
        </div>
        <section id="rigPanel" class="rig-panel hidden" aria-label="Monster rig builder">
          <h2>Monster Rig</h2>
          <label>Rig Part <select id="rigRole"></select></label>
          <label>Preview Art <select id="rigVariant"></select></label>
          <div class="grid-two">
            <label>X <input id="rigX" type="number" step="1" /></label>
            <label>Y <input id="rigY" type="number" step="1" /></label>
            <label>Scale <input id="rigScale" type="number" step="0.01" min="0.1" max="4" /></label>
            <label>Rotate <input id="rigRotation" type="number" step="1" min="-180" max="180" /></label>
            <label>Anchor X <input id="rigAnchorX" type="number" step="0.01" min="0" max="1" /></label>
            <label>Anchor Y <input id="rigAnchorY" type="number" step="0.01" min="0" max="1" /></label>
          </div>
          <div class="tool-row">
            <button id="rigSnapBtn" type="button">Snap To Socket</button>
            <button id="rigSaveBtn" type="button">Save Rig</button>
            <button id="rigExportBtn" type="button">Export Rig</button>
            <button id="rigResetBtn" type="button">Reset Pose</button>
          </div>
        </section>
        <label>Building Art <select id="buildingAsset"></select></label>
        <label>Human Art <select id="humanAsset"></select></label>
        <label>Human Kind <select id="humanKind"><option value="window">Window</option><option value="ground">Ground</option></select></label>
        <label>Vehicle Art <select id="vehicleAsset"></select></label>
        <div class="grid-two">
          <label>Rows <input id="rows" type="number" min="2" max="14" value="7" /></label>
          <label>Cols <input id="cols" type="number" min="2" max="6" value="3" /></label>
          <label>HP <input id="buildingHp" type="number" min="1" max="8" value="2" /></label>
          <label>Points <input id="points" type="number" min="10" max="500" value="80" /></label>
          <label>Crash % <input id="structuralLimit" type="number" min="25" max="90" value="50" /></label>
          <label>Fall <select id="fallBias"><option value="auto">Auto</option><option value="left">Left</option><option value="right">Right</option></select></label>
        </div>
        <div class="tool-row">
          <button id="duplicateBtn" type="button">Duplicate</button>
          <button id="deleteBtn" type="button">Delete</button>
        </div>
        <div class="tool-row">
          <button id="saveBtn" type="button">Save Local</button>
          <button id="exportBtn" type="button">Export JS</button>
        </div>
        <textarea id="exportBox" spellcheck="false"></textarea>
        <p id="status">Ready.</p>
      </aside>
      <section class="canvas-wrap">
        <canvas id="builderCanvas" width="1280" height="720"></canvas>
      </section>
    </main>
    <script src="level-data.js?v=20260527-3"></script>
    <script src="builder.js?v=20260527-3"></script>
  </body>
</html>
